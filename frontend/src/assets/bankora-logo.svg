<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="BankOra AI logo">
  <defs>
    <!-- Brand gradients: bank + oracle (aura) + AI signal -->
    <linearGradient id="bo-primary" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B5ED7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bo-aurora" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="bo-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft background aura (oracle) -->
  <circle cx="32" cy="32" r="28" fill="url(#bo-glow)" />
  <circle cx="32" cy="32" r="27" fill="#ffffff" opacity="0.96"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#bo-primary)" stroke-width="2"/>

  <!-- Stylized monogram: B + O + orbiting AI node -->
  <!-- B shaft -->
  <path d="M22 18 v28" stroke="url(#bo-primary)" stroke-width="4" stroke-linecap="round"/>
  <!-- B loops -->
  <path d="M22 20 h10 a6 6 0 0 1 0 12 h-10" fill="none" stroke="url(#bo-primary)" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 32 h12 a7 7 0 0 1 0 14 h-12" fill="none" stroke="url(#bo-primary)" stroke-width="4" stroke-linecap="round"/>

  <!-- O ring (Ora) -->
  <circle cx="42" cy="32" r="9.5" fill="none" stroke="url(#bo-aurora)" stroke-width="3"/>

  <!-- AI orbit + node -->
  <path d="M42 21.5 a10.5 10.5 0 0 1 0 21 a10.5 10.5 0 0 1 0 -21" fill="none" stroke="#0EA5E9" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="49" cy="27" r="2.2" fill="#22C55E"/>

  <!-- Subtle highlight -->
  <ellipse cx="32" cy="24" rx="18" ry="7" fill="#ffffff" opacity="0.18"/>
</svg>

